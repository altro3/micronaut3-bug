app:
  node:
    name: ift2
  trace:
    enabled: true
    export:
      enabled: false
      url: http://localhost:4318/v1/traces
      # Напрямую в викторию
      #url: http://localhost:10428/insert/opentelemetry/v1/traces
      connect-timeout: 2s
    http:
      enabled: true
    jdbc:
      enabled: true
  log:
    enabled: true
    mdc-keys: test
    pretty-print: true
    max-payload-size: 4MB
    export:
      enabled: false
      url: http://localhost:4318/v1/logs
      # Напрямую в викторию
      # url: http://localhost:9428/insert/opentelemetry/v1/logs

server:
  port: 8090
  tomcat:
    additional-tld-skip-patterns: "*"

spring:
  application:
    name: mymcp-server
  servlet:
    multipart:
      enabled: true
  web:
    locale: en_US
    locale-resolver: fixed
    resources:
      add-mappings: false
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        enabled: true
        name: adbroker-automation-engine
        version: 1.0.0
        instructions: "Этот сервер предоставляет stateless-инструменты для прямой публикации рекламных кампаний и размещения готовых креативов в кабинетах VK и Яндекс.Директ."
        protocol: stateless
management:
  server:
    port: 9090
  observations:
    key-values:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, mappings
  metrics:
    distribution:
      percentiles-histogram:
        all: true
    enable:
      all: true
  otlp:
    metrics:
      export:
        enabled: false
        #url: http://localhost:8428/opentelemetry/v1/metrics
        url: http://localhost:4318/v1/metrics
        step: PT10S
        aggregation-temporality: delta
        headers:
          Content-Type: application/x-protobuf
        resource-attributes:
          "service.name": ${spring.application.name}
          "deployment.environment": ${app.node.name}
logging:
  pattern:
    console: "%d{MM-dd HH:mm:ss.SSS} %highlight{%level} %style{%uMDC}{magenta} [%t] %style{%logger{1.}}{cyan} : %msg%n%uEx"
  level:
    root: debug
    jdk: warn
    sun: warn
    javax: info
    io.netty: info
    com.zaxxer: warn
    org.apache: warn
    org.flywaydb: info
    liquibase: info
    io.micrometer: info
    org.postgresql: info
    org.eclipse: info
    org.hibernate: info
    org.springframework: debug
    #    reactor.netty.http.server.HttpServer: DEBUG
    reactor: info
