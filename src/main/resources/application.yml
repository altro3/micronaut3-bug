app:
  mock:
    enabled: true
  node:
    name: ift2
  trace:
    enabled: true
    exporter:
      enabled: true
      url: http://localhost:4318/v1/traces
      # Напрямую в викторию
      #url: http://localhost:10428/insert/opentelemetry/v1/traces
      connect-timeout: 2s
  log:
    enabled: true
    pattern:
      console: "%d{HH:mm:ss.SSS} %highlight(%-5level) %magenta(%mdcBlock)[%thread] %cyan(%logger{25}) - %msg%n%throwable"
    mdc-keys: test
    pretty-print: true
    max-payload-size: 4MB
    loki:
      enabled: false
      batch-timeout: PT20S
    otlp:
      enabled: true
      url: http://localhost:4318/v1/logs
      # Напрямую в викторию
      # url: http://localhost:9428/insert/opentelemetry/v1/logs
  integration:
    ext-service:
      endpoints:
        ping:
          path: /health/check
          method: GET
        process-file:
          path: /v1/files/upload
          method: POST
        update-data:
          path: /v1/data/sync
          method: POST
        complex-multipart:
          path: /v2/complex-process/{id}
          method: POST
      http:
        service-name: ext-service
        url: http://localhost:8081
        type: external
        compress: true
        log:
          pretty-print: true
          max-payload-size: 4MB
    service2:
      endpoints:
        ping:
          path: /internal/ping
          method: GET
      http:
        service-name: service2
        url: http://localhost:9080

server:
  port: 8080

spring:
  application:
    name: service1
  servlet:
    multipart:
      enabled: true
  web:
    locale: en_US
    locale-resolver: fixed
  main:
    banner-mode: off
  http:
    codecs:
      max-in-memory-size: 10MB

management:
  observations:
    key-values:
      enabled: true # Включает дефолтные теги
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    enable:
      all: true # Принудительно включает всё
      "http.server.requests": true # Включает конкретно HTTP запросы
#  otlp:
#    metrics:
#      export:
#        url: http://localhost:8428/opentelemetry/v1/metrics
#        step: 10s
#        aggregation-temporality: cumulative
#        resource-attributes:
#          "service.name": ${spring.application.name}
#          "deployment.environment": ${app.node.name}
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{25}) - %msg%n%throwable"
  level:
    root: debug
    jdk: info
    sun: info
    javax: info
    io.netty: info
    org.apache: info
    org.eclipse: info
    org.hibernate: info
    org.springframework: info
#    reactor.netty.http.server.HttpServer: DEBUG
    reactor: info
