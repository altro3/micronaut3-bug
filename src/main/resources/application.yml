app:
  log:
    pattern:
      console: "%d{HH:mm:ss.SSS} %highlight(%-5level) %magenta(%mdcBlock)[%thread] %cyan(%logger{25}) - %msg%n%throwable"
    mdc-keys: test

server:
  port: 8080

spring:
  servlet:
    multipart:
      enabled: true
  web:
    locale: en_US
    locale-resolver: fixed
  main:
    banner-mode: off
  http:
    codecs:
      max-in-memory-size: 10MB

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{25}) - %msg%n%throwable"
  level:
    root: debug
    sun: info
    javax: info
    io.netty: info
    org.apache: info
    org.eclipse: info
    org.hibernate: info
    org.springframework: info
#    reactor.netty.http.server.HttpServer: DEBUG
    reactor: info
