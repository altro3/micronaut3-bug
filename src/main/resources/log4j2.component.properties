# 1. Асинхронность через LMAX Disruptor
log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector

# 2. ВКЛЮЧАЕМ Garbage-Free (КРИТИЧНО)
log4j2.enableThreadlocals=true
log4j2.garbagefree.ThreadContextMap=true

# 3. Размер кольцевого буфера
log4j2.asyncLoggerConfigRingBufferSize=65536

# 4. Стратегия ожидания (Yield — золотая середина между скоростью и CPU)
log4j2.asyncLoggerConfigWaitStrategy=Yield
