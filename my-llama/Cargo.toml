[package]
name = "my-llama"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sonic-rs = "0.5"
regex-automata = { version = "0.4", features = ["alloc", "syntax", "unicode", "dfa", "hybrid"] }
memmap2 = "0.9"
rayon = "1.12"
dary_heap = "0.3"
fxhash = "0.2"
regex = "1.13"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tiktoken-rs = "0.12"
tokenizers = "0.23"

[lib]
name = "my_llama"
path = "src/lib.rs"

[[bin]]
name = "infer"
path = "src/bin/infer.rs"

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "load_tokenizer"
path = "src/bin/load_tokenizer.rs"

[[bin]]
name = "train_tokenizer"
path = "src/bin/train_tokenizer.rs"

[[bin]]
name = "test_trainer"
path = "src/bin/test_trainer.rs"

[[bin]]
name = "cuda_adamw"
path = "src/bin/cuda_adamw.rs"

[[bin]]
name = "cuda_cross_entropy_loss"
path = "src/bin/cuda_cross_entropy_loss.rs"

[[bin]]
name = "cuda_dequantize_block_gguf_q4_k"
path = "src/bin/cuda_dequantize_block_gguf_q4_k.rs"

[[bin]]
name = "cuda_embeddings"
path = "src/bin/cuda_embeddings.rs"

[[bin]]
name = "cuda_fused_attention"
path = "src/bin/cuda_fused_attention.rs"

[[bin]]
name = "cuda_matmul"
path = "src/bin/cuda_matmul.rs"

[[bin]]
name = "cuda_matmul_gguf_q4_k"
path = "src/bin/cuda_matmul_gguf_q4_k.rs"

[[bin]]
name = "cuda_rope"
path = "src/bin/cuda_rope.rs"

[[bin]]
name = "cuda_rmsnorm"
path = "src/bin/cuda_rmsnorm.rs"

[[bin]]
name = "cuda_sampling"
path = "src/bin/cuda_sampling.rs"

[[bin]]
name = "cuda_speculative_verify"
path = "src/bin/cuda_speculative_verify.rs"

[[bin]]
name = "cuda_swiglu"
path = "src/bin/cuda_swiglu.rs"

[[bin]]
name = "infer_simple"
path = "src/bin/infer_simple.rs"

[[bench]]
name = "tokenizer_benchmark"
path = "tests/benches/tokenizer_benchmark.rs"
harness = false

[[bench]]
name = "trainer_benchmark"
path = "tests/benches/trainer_bench.rs"
harness = false

[[test]]
name = "tokenizer_integration_tests"
path = "tests/tokenizer/tokenizer_integration_tests.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 16

[profile.dev]
opt-level = 1
debug = true
panic = "abort"
