server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"
  log_received_spans:
    enabled: true

ingester:
  max_block_duration: 5m
  lifecycler:
    ring:
      replication_factor: 1

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    block:
      version: vParquet3

metrics_generator:
  registry:
    external_labels:
      source: tempo
  processor:
    local_blocks:
      filter_server_spans: true
      flush_to_storage: true
  traces_storage:
    path: /tmp/tempo/generator/traces
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write # Отправляем метрики в Prometheus
        send_exemplars: true

overrides:
  defaults:
    ingestion:
      max_traces_per_user: 10000
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks] # Для крутых графиков в Grafana

# Чтобы заработал /api/v2/search/recent
querier: {}

query_frontend: {}
