server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"
  log_received_spans:
    enabled: true

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

overrides:
  defaults:
    ingestion:
      max_traces_per_user: 10000
    metrics_generator:
      processors: [service-graphs, span-metrics] # Для крутых графиков в Grafana

# Чтобы заработал /api/v2/search/recent
querier: {}

query_frontend: {}
