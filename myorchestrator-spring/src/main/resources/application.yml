app:
  node:
    name: ift2
  trace:
    enabled: true
    export:
      enabled: false
      url: http://localhost:4318/v1/traces
      connect-timeout: 2s
    http:
      enabled: true
    jdbc:
      enabled: true
  log:
    enabled: true
    mdc-keys: test
    pretty-print: true
    max-payload-size: 4MB
    export:
      enabled: false
      url: http://localhost:4318/v1/logs


  integration:
    mcp-server:
      http:
        connect-timeout: 5000
        read-timeout: 30000
        max-in-memory-size: 10485760
      endpoints:
        sse:
          url: http://localhost:8080/api/v1/mcp

server:
  port: 8083
  tomcat:
    additional-tld-skip-patterns: "*"

spring:
  application:
    name: myorchestrator-spring
  servlet:
    multipart:
      enabled: true
  web:
    locale: en_US
    locale-resolver: fixed
    resources:
      add-mappings: false
  main:
    banner-mode: off
  ai:
    openai:
      api-key: local-secret
      chat:
        base-url: http://localhost:8500
        model: qwen3.6
        temperature: 0.7

management:
  server:
    port: 9091
  observations:
    key-values:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        all: true
    enable:
      all: true
  otlp:
    metrics:
      export:
        enabled: false
        #url: http://localhost:8428/opentelemetry/v1/metrics
        url: http://localhost:4318/v1/metrics
        step: PT10S
        aggregation-temporality: delta
        headers:
          Content-Type: application/x-protobuf
        resource-attributes:
          "service.name": ${spring.application.name}
          "deployment.environment": ${app.node.name}
logging:
  pattern:
    console: "%d{MM-dd HH:mm:ss.SSS} %highlight{%level} %style{%uMDC}{magenta} [%t] %style{%logger{1.}}{cyan} : %msg%n%uEx"
  level:
    root: debug
    jdk: warn
    sun: warn
    javax: info
    io.netty: info
    com.zaxxer: warn
    org.apache: warn
    org.flywaydb: info
    liquibase: info
    io.micrometer: info
    org.postgresql: info
    org.eclipse: info
    org.hibernate: info
    org.springframework: info
    #    reactor.netty.http.server.HttpServer: DEBUG
    reactor: info
